services:
  - type: web
    name: accurate-power-crm
    env: node
    buildCommand: npm run build
    startCommand: node backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Fix round 1 / N10, corrected by Fix round 2 / R2-S5 — pdfjs-dist@5
      # (backend/src/estimating/pdfjsLoader.ts, used for sheet indexing)
      # needs Node >=20.16.0 <21 || >=22.3.0. N10's own fix pinned an EXACT
      # patch (20.16.0) so production would never silently run on an
      # unpinned Render default — but Node 20 reached end of life in April
      # 2026, so that exact pin left production stuck on an unsupported
      # runtime indefinitely, with no way for a routine Render bump to ever
      # move it forward. R2-S5: pin a supported LTS MAJOR instead of an
      # exact patch — "22" tracks whatever the current Node 22.x patch is
      # (Render resolves the latest release in that major), so this never
      # goes stale the same way again, while still never silently dropping
      # onto an unpinned/rolled-back default. Kept in sync with
      # backend/package.json's own `engines.node` (">=22 <23").
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      # Long-lived key for automation / browser-extension lead creation, sent as
      # the X-API-Key header on POST /api/leads. Set the value in the Render
      # dashboard (Environment tab); sync:false keeps it dashboard-managed and
      # out of git.
      - key: AUTOMATION_API_KEY
        sync: false
      # Microsoft Graph (app-only) credentials for automated lead first-contact
      # email. Entra app registration with APPLICATION permission Mail.Send,
      # admin-consented and scoped to JakeS@accuratepowerandtechnology.com via an
      # Application Access Policy. Dashboard-managed (sync:false) to keep secrets
      # out of git.
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      # Production runs on Supabase Postgres, not a Render-managed database —
      # a declared `databases:` block here previously created and pointed at
      # a SEPARATE Render Postgres instance nobody used for real data (the
      # legacy trap behind the 2026-09-02 wrong-database restore: a restore
      # run against the connection this key pointed at landed on the empty
      # decoy, not Supabase, and looked like data loss). Set the real
      # Supabase connection string in the Render dashboard (Environment
      # tab); sync:false keeps it dashboard-managed and out of git. See
      # docs/DEPLOY.md before ever changing this value.
      - key: DATABASE_URL
        sync: false
